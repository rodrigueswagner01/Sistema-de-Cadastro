<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto — Sistema de Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/formularios.css">
</head>
<body>
  <header id="topo"></header>
  <main class="pagina">
    <div class="pagina__cabecalho">
      <div>
        <h1 class="pagina__titulo" id="titulo-pagina">Novo produto</h1>
        <p class="pagina__subtitulo" id="subtitulo-pagina">Dados do produto e quantidade em estoque.</p>
      </div>
    </div>

    <section class="cartao formulario">
      <form id="form-produto" novalidate>
        <div class="campo" id="campo-nome">
          <label for="nome">Nome do produto</label>
          <input type="text" id="nome" autocomplete="off" aria-describedby="erro-nome">
          <span class="mensagem-campo" id="erro-nome"></span>
        </div>
        <div class="campo" id="campo-descricao">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" rows="3" aria-describedby="erro-descricao"></textarea>
          <span class="mensagem-campo" id="erro-descricao"></span>
        </div>
        <div class="linha-campos">
          <div class="campo" id="campo-quantidade">
            <label for="quantidade">Quantidade em estoque</label>
            <input type="number" id="quantidade" min="0" step="1" inputmode="numeric" aria-describedby="previa-nivel erro-quantidade">
            <span class="previa-nivel" id="previa-nivel" aria-live="polite"></span>
            <span class="mensagem-campo" id="erro-quantidade"></span>
          </div>
          <div class="campo" id="campo-status">
            <label for="status">Status</label>
            <select id="status" aria-describedby="dica-status erro-status">
              <option value="">Selecione…</option>
              <option value="DISPONIVEL">Disponível</option>
              <option value="VENDIDO">Vendido</option>
            </select>
            <span class="dica" id="dica-status">Ajustado automaticamente: quantidade 0 vira “Vendido”.</span>
            <span class="mensagem-campo" id="erro-status"></span>
          </div>
        </div>

        <div class="formulario__acoes">
          <a class="botao botao--secundario" href="produtos.html">Cancelar</a>
          <button type="submit" class="botao botao--primario">Salvar produto</button>
        </div>
      </form>
    </section>
  </main>
  <script src="../js/util.js"></script>
  <script src="../js/dados.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/produto-form.js"></script>
</body>
</html>
