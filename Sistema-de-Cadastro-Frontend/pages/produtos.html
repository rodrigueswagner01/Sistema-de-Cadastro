<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos — Sistema de Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/tabelas.css">
  <link rel="stylesheet" href="../css/formularios.css">
</head>
<body>
  <header id="topo"></header>
  <main class="pagina">
    <div class="pagina__cabecalho">
      <div>
        <h1 class="pagina__titulo">Produtos</h1>
        <p class="pagina__subtitulo">Cadastre, edite e registre vendas do estoque.</p>
      </div>
      <a class="botao botao--primario" href="produto-form.html">+ Novo produto</a>
    </div>

    <div class="barra-ferramentas">
      <div class="campo busca">
        <label class="visualmente-oculto" for="busca">Buscar produto</label>
        <input type="search" id="busca" placeholder="Buscar produto por nome" autocomplete="off">
      </div>
      <div class="campo">
        <label class="visualmente-oculto" for="filtro-nivel">Filtrar por nível</label>
        <select id="filtro-nivel">
          <option value="">Todos os níveis</option>
          <option value="ESGOTADO">Esgotado</option>
          <option value="CRITICO">Crítico</option>
          <option value="BAIXO">Baixo</option>
          <option value="NORMAL">Normal</option>
        </select>
      </div>
    </div>
    <p class="contador" id="contador" aria-live="polite"></p>

    <div class="cartao tabela-caixa">
      <table class="tabela" id="tabela">
        <thead>
          <tr><th scope="col">Produto</th><th scope="col">Descrição</th><th scope="col" class="numero">Qtd.</th><th scope="col">Nível</th><th scope="col">Status</th><th scope="col"><span class="visualmente-oculto">Ações</span></th></tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <div class="tabela-vazia" id="vazio" hidden><strong>Nenhum produto encontrado</strong>Ajuste a busca ou o filtro, ou cadastre um novo produto.</div>
    </div>
  </main>
  <script src="../js/util.js"></script>
  <script src="../js/dados.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/produtos.js"></script>
</body>
</html>
